version: '3.8'

services:
  # -------------------------------------------------------------------------
  # Web 应用程序容器
  # -------------------------------------------------------------------------
  web:
    # 方式 A：直接从当前本地源码构建镜像（推荐，适合包含开发修改的情况）
    build:
      context: .
      dockerfile: Dockerfile
    
    # 方式 B：使用预构建好的 GitHub Container Registry 镜像（需取消注释，并注释掉上面的 build）
    # image: ghcr.io/sakumyz/bill-center:latest

    container_name: bill-center-web
    restart: always
    ports:
      # 从环境变量中读取 HOST_PORT 和 PORT，若未指定则默认映射 3000:3000
      - "${HOST_PORT:-3000}:${PORT:-3000}"
    
    environment:
      # 1. 数据库配置：传入拆分后的参数，运行时由应用程序动态拼接连接串
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres_secure_pwd}
      - DB_HOST=db # 指向 docker 网段下的 db 容器服务
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-bill_center}
      
      # 2. AI 服务相关环境变量：从宿主机 .env 文件直接插值传入
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL}
      - OPENAI_MODEL=${OPENAI_MODEL}
      
      # 3. 运行端口
      - PORT=${PORT:-3000}
    
    # 依赖关系：db 服务健康检查通过后，才启动 web 服务
    depends_on:
      db:
        condition: service_healthy

  # -------------------------------------------------------------------------
  # PostgreSQL 数据库容器
  # -------------------------------------------------------------------------
  db:
    image: postgres:15-alpine
    container_name: bill-center-db
    restart: always
    environment:
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres_secure_pwd}
      - POSTGRES_DB=${DB_NAME:-bill_center}
    
    # 卷挂载（持久化数据库数据）
    volumes:
      - pgdata:/var/lib/postgresql/data
    
    ports:
      # 从环境变量中读取数据库外露端口 HOST_DB_PORT，若未指定则默认映射 5432:5432
      - "${HOST_DB_PORT:-5432}:5432"
    
    # 健康检查，确保 Postgres 完全启动可接受连接
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-bill_center}"]
      interval: 5s
      timeout: 5s
      retries: 5

# -------------------------------------------------------------------------
# 数据卷定义
# -------------------------------------------------------------------------
volumes:
  pgdata: # 命名卷，持久化存储 PostgreSQL 数据
