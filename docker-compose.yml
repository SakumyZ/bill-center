services:
  # -------------------------------------------------------------------------
  # Web 应用程序容器（直接从镜像仓库拉取）
  # -------------------------------------------------------------------------
  web:
    # 使用预构建并推送好的镜像，无需本地 Dockerfile 和源码
    image: ghcr.io/sakumyz/bill-center:latest
    container_name: bill-center-web
    restart: always
    ports:
      - '${HOST_PORT:-3000}:${PORT:-3000}'
    environment:
      # 数据库配置
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres_secure_pwd}
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-bill_center}
      # AI 服务
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL}
      - OPENAI_MODEL=${OPENAI_MODEL}
      # 运行端口
      - PORT=${PORT:-3000}
    depends_on:
      db:
        condition: service_healthy

  # -------------------------------------------------------------------------
  # PostgreSQL 数据库容器
  # -------------------------------------------------------------------------
  db:
    image: postgres:15-alpine
    container_name: bill-center-db
    restart: always
    environment:
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres_secure_pwd}
      - POSTGRES_DB=${DB_NAME:-bill_center}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '${HOST_DB_PORT:-5432}:5432'
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-bill_center}']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
